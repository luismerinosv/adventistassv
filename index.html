<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Adventistas SV - Frases e Imágenes</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo-turquesa.png">

  <!-- Meta etiquetas Open Graph / Facebook / WhatsApp / Telegram -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://luismerinosv.github.io/adventistassv/">
  <meta property="og:title" content="Adventistas SV • Frases e inspiración diaria">
  <meta property="og:description" content="Encuentra inspiración diaria y diseña tus propias imágenes y videos con frases adventistas para compartir en tus redes sociales.">
  <meta property="og:image" content="https://luismerinosv.github.io/adventistassv/og-image.jpg">
  <meta property="og:image:secure_url" content="https://luismerinosv.github.io/adventistassv/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">

  <!-- Meta etiquetas para Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://luismerinosv.github.io/adventistassv/">
  <meta name="twitter:title" content="Adventistas SV • Frases e inspiración diaria">
  <meta name="twitter:description" content="Encuentra inspiración diaria y diseña tus propias imágenes y videos con frases adventistas para compartir en tus redes sociales.">
  <meta name="twitter:image" content="https://luismerinosv.github.io/adventistassv/og-image.jpg">
  
  <!-- Tipografías Google Fonts Ampliadas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alex+Brush&family=Anton&family=Bebas+Neue&family=Caveat:wght@600;700&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,600&family=Courgette&family=Dancing+Script:wght@700&family=Great+Vibes&family=Italianno&family=Lora:ital,wght@0,600;1,500&family=Merriweather:ital,wght@0,700;1,400&family=Montserrat:ital,wght@0,700;0,900;1,500;1,600&family=Oswald:wght@600&family=Outfit:wght@600;700;900&family=Pacifico&family=Playfair+Display:ital,wght@0,700;1,600&family=Poppins:wght@400;500;600;700;900&family=Quicksand:wght@600;700&family=Righteous&family=Sacramento&family=Satisfy&display=swap" rel="stylesheet">

  <!-- Librería Oficial para Inyección de Duración en Encabezados WebM -->
  <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.5/fix-webm-duration.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #00838f;
      --accent-hover: #006064;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 40px;
      width: 100%;
    }

    /* ENCABEZADO SUPERIOR */
    header {
      text-align: center;
      padding: 16px 15px 8px;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .header-logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 55px;
      margin-bottom: 4px;
    }

    .header-logo {
      height: 60px;
      width: auto;
      object-fit: contain;
    }

    header p { color: var(--text-muted); font-size: 0.82rem; }

    /* NAVEGACIÓN FIJA AL SCROLL */
    .sticky-nav-wrapper {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 9999;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.80rem;
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .tab-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .tab-btn-share {
      background: transparent;
      border-color: rgba(255, 255, 255, 0.15);
      color: var(--text);
    }

    .tab-btn-social {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      padding: 0;
      border-color: rgba(255, 255, 255, 0.15);
      color: var(--text);
      border-radius: 8px;
    }
    .tab-btn-social:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: var(--accent);
    }
    .tab-btn-social svg {
      width: 18px;
      height: 18px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
      overflow-x: hidden;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
    }

    .date-selector-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    input[type="date"] {
      color-scheme: dark !important;
      color: #ffffff !important;
      background-color: var(--bg-dark);
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: invert(35%) sepia(100%) saturate(2000%) hue-rotate(145deg) brightness(95%) contrast(105%) !important;
      opacity: 1 !important;
    }

    .grid-daily {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .canvas-container {
      width: 100%;
      aspect-ratio: 4 / 5;
      position: relative;
      background: #000;
      cursor: pointer;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .card-actions {
      padding: 8px;
      display: flex;
      gap: 6px;
      background: #172033;
      border-top: 1px solid var(--border);
    }

    .btn {
      flex: 1;
      padding: 8px 4px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      font-size: 0.82rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.15s, border-color 0.15s;
      min-height: 36px;
      text-decoration: none;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      border-color: var(--border);
      color: var(--text-muted);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      border-color: #475569;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .editor-layout {
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
      width: 100%;
    }

    .editor-preview {
      width: 100%;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .editor-controls {
      width: 100%;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: #fff;
      padding: 9px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.88rem;
      min-height: 40px;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 75px;
    }

    .ig-music-trigger-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .ig-music-trigger-card:hover {
      border-color: var(--accent);
      background: rgba(0, 131, 143, 0.08);
    }

    .music-modal-card {
      background: #1e293b;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .music-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.98rem;
    }

    .modal-preview-top-container {
      padding: 12px;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .modal-preview-canvas-wrapper {
      width: 200px;
      aspect-ratio: 4 / 5;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      background: #000;
      border: 1px solid var(--border);
    }

    .music-search-bar-wrapper {
      padding: 12px 16px 8px;
      display: flex;
      gap: 8px;
    }

    .music-tabs-scroll {
      display: flex;
      gap: 8px;
      padding: 4px 16px 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .music-tab-pill {
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .music-tab-pill.active {
      background: #fff;
      color: #000;
      border-color: #fff;
      font-weight: 600;
    }

    .music-list-container {
      overflow-y: auto;
      max-height: 380px;
      padding: 0 8px 12px;
      display: flex;
      flex-direction: column;
    }

    .music-track-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s ease;
      margin-bottom: 4px;
    }
    .music-track-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .music-track-item.selected {
      background: rgba(0, 131, 143, 0.22);
      border: 1px solid var(--accent);
    }

    .track-preview-btn {
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 0.8rem;
      font-weight: 500;
      flex-shrink: 0;
      gap: 4px;
    }
    .track-preview-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    .bg-grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .bg-grid-container {
      max-height: 280px;
      overflow-y: auto;
      padding: 10px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .bg-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .bg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
      gap: 8px;
    }

    .bg-thumb {
      aspect-ratio: 4 / 5;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      object-fit: cover;
      width: 100%;
      height: 100%;
      transition: transform 0.15s, border-color 0.15s;
      background-color: #1e293b;
    }

    .bg-thumb:hover { transform: scale(1.04); }
    .bg-thumb.active {
      border-color: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.82);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 16px;
      backdrop-filter: blur(4px);
    }
    .modal.active { display: flex; }
    .modal-content {
      max-width: 95vw;
      max-height: 85vh;
      border-radius: 12px;
      object-fit: contain;
    }
    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      background: rgba(255,255,255,0.15);
      color: white; border: none; font-size: 20px;
      border-radius: 50%; width: 36px; height: 36px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .minimal-menu-card {
      background: #1e293b;
      color: #f8fafc;
      border-radius: 12px;
      padding: 12px 0;
      width: 320px;
      max-width: 90vw;
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
    }

    .minimal-menu-title {
      padding: 6px 18px 12px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.88rem;
      color: #94a3b8;
    }

    .minimal-menu-item {
      display: flex;
      align-items: center;
      padding: 12px 18px;
      color: #f8fafc;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
    }
    .minimal-menu-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .minimal-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .editor-preview, .editor-controls {
        width: 100%;
        padding: 16px;
      }
      .grid-daily {
        grid-template-columns: 1fr;
      }
      .header-logo { height: 50px; }
      .container { padding: 12px; }
      .tab-btn { font-size: 0.76rem; padding: 7px 4px; }
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO SUPERIOR CON LOGO -->
  <header>
    <div class="header-logo-container">
      <img id="mainLogoHeader" src="logo.png" alt="Adventistas SV" class="header-logo" onload="processHeaderLogo(this)">
    </div>
    <p>Frases e inspiración diaria • @adventistassv</p>
  </header>

  <!-- NAVEGACIÓN FIJA AL SCROLL -->
  <nav class="sticky-nav-wrapper">
    <div class="nav-tabs">
      <button id="tabBtnGallery" class="tab-btn active" onclick="switchTab('gallery')">Frases del Día</button>
      <button id="tabBtnEditor" class="tab-btn" onclick="switchTab('editor')">Creador</button>
      <button class="tab-btn tab-btn-share" onclick="shareWebsite()">Compartir</button>
      
      <a href="https://instagram.com/adventistassv" target="_blank" rel="noopener" class="tab-btn tab-btn-social" title="Síguenos en Instagram (@adventistassv)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>

      <a href="https://facebook.com/adventistassv" target="_blank" rel="noopener" class="tab-btn tab-btn-social" title="Síguenos en Facebook (@adventistassv)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
        </svg>
      </a>
    </div>
  </nav>

  <div class="container">
    <!-- GALERÍA DIARIA -->
    <div id="gallerySection">
      <div class="section-header">
        <h2 class="section-title" id="galleryTitle">Frases del Día</h2>
        <div class="date-selector-group">
          
          <label for="selectQuoteCategory" style="font-size: 0.82rem; color: var(--text-muted);">Ver:</label>
          <select id="selectQuoteCategory" class="form-control" style="width: auto; min-height: 36px; padding: 4px 8px; font-size:0.82rem;" onchange="generateNewQuotesSet()">
            <option value="todas" selected>Todas las Frases</option>
            <option value="biblia">Solo Biblia</option>
            <option value="escritos">Solo Escritos (E.G. White)</option>
            <option value="himnos">Solo Himnos Adventistas</option>
          </select>

          <label for="historyDate" style="font-size: 0.82rem; color: var(--text-muted);">Fecha:</label>
          <input type="date" id="historyDate" class="form-control" style="width: auto; min-height: 36px; padding: 4px 8px;" onchange="loadQuotesForSelectedDate(this.value)">
          <button class="btn btn-secondary" style="min-height: 36px; padding: 4px 10px;" onclick="resetToTodayDate()">Hoy</button>
          
          <button class="btn btn-secondary" style="min-height: 36px; padding: 4px 8px; white-space: nowrap;" onclick="generateNewQuotesSet()">Actualizar</button>
        </div>
      </div>
      <div id="dailyGrid" class="grid-daily"></div>
    </div>

    <!-- CREADOR PERSONALIZADO -->
    <div id="editorSection" class="hidden">
      <h2 class="section-title" style="margin-bottom: 16px;">Diseña tu propia imagen o video</h2>
      
      <div class="editor-layout">
        
        <div class="editor-preview">
          <div id="previewBox" class="canvas-container" style="max-width: 420px; border-radius: 10px; overflow: hidden;" onclick="openCanvasModal(document.getElementById('customCanvas'))">
            <canvas id="customCanvas"></canvas>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; width: 100%; max-width: 420px;">
            <button class="btn btn-secondary" style="flex: 1;" onclick="openCanvasModal(document.getElementById('customCanvas'))">Ver</button>
            <button class="btn btn-secondary" style="flex: 1;" onclick="shareCanvasCard(document.getElementById('customCanvas'), document.getElementById('inputPhrase').value, document.getElementById('inputCitation').value, document.getElementById('inputHandle').value)">Compartir</button>
            <button class="btn" style="flex: 1;" onclick="downloadCustomImage()">Descargar WebP / PNG</button>
            
            <button id="btnPlayPreview" class="btn btn-secondary" style="width: 100%; margin-top: 4px;" onclick="previewAnimation()">
              Previsualizar Animación Completa
            </button>
            <button id="btnDescargarVideo" class="btn" style="width: 100%; background: #00838f; font-weight: 600;" onclick="generarVideoAnimado()">
              Descargar Video MP4 (Reel/Story/WhatsApp)
            </button>
          </div>
        </div>

        <div class="editor-controls">
          <div class="form-group">
            <label>Texto de la Frase:</label>
            <textarea id="inputPhrase" class="form-control" oninput="updateCustomCanvas()">DE LA MANO DE DIOS PUEDES CON TODO ¡NO TE RINDAS!</textarea>
          </div>

          <div class="form-group">
            <label>Cita / Referencia:</label>
            <input type="text" id="inputCitation" class="form-control" value="Filipenses 4:13" oninput="updateCustomCanvas()">
          </div>

          <div class="form-group">
            <label>Usuario / Pie de Imagen:</label>
            <input type="text" id="inputHandle" class="form-control" value="@adventistassv" oninput="updateCustomCanvas()">
          </div>

          <!-- SELLO / MARCA DE CAMPAÑA -->
          <div class="form-group" style="margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--border);">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; color: #fff;">
              <input type="checkbox" id="chkShowStamp" onchange="toggleStampInputs(); updateCustomCanvas();" style="width: 18px; height: 18px; accent-color: var(--accent);">
              Activar Sello / Marca de Campaña (ej. UNAVOZ27)
            </label>
          </div>
