<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventistas SV - Frases e Imágenes</title>
  
  <!-- Tipografías de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel:wght@700&family=Lora:ital,wght@0,600;1,500&family=Montserrat:wght@700;800&family=Oswald:wght@600&family=Playfair+Display:ital,wght@0,700;1,600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #00838f;
      --accent-hover: #006064;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 40px;
    }

    /* Header */
    header {
      text-align: center;
      padding: 25px 20px 15px;
      background: #090d16;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.8rem; color: #fff; margin-bottom: 4px; }
    header p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; }

    /* Pestañas */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }
    .tab-btn {
      padding: 10px 20px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .tab-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .section-title {
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: #fff;
    }

    /* Galería Diaria */
    .grid-daily {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .canvas-container {
      width: 100%;
      aspect-ratio: 4 / 5;
      position: relative;
      background: #000;
      cursor: pointer;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .card-actions {
      padding: 10px;
      display: flex;
      gap: 6px;
      background: #172033;
      border-top: 1px solid var(--border);
    }

    .btn {
      flex: 1;
      padding: 9px 4px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.08); }

    /* Módulo Editor */
    .editor-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    .editor-controls {
      background: var(--card-bg);
      padding: 22px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-control {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 70px;
    }

    /* Galería Visual de Miniaturas */
    .bg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding: 6px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .bg-thumb {
      aspect-ratio: 4 / 5;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      object-fit: cover;
      width: 100%;
      height: 100%;
      transition: transform 0.15s, border-color 0.15s;
    }

    .bg-thumb:hover { transform: scale(1.05); }
    .bg-thumb.active {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .editor-preview {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    /* Modal Visor */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(5px);
    }
    .modal.active { display: flex; }
    .modal-content {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 12px;
      object-fit: contain;
    }
    .modal-close {
      position: absolute;
      top: 20px; right: 20px;
      background: rgba(255,255,255,0.2);
      color: white; border: none; font-size: 24px;
      border-radius: 50%; width: 44px; height: 44px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .editor-layout { grid-template-columns: 1fr; }
      .grid-daily { grid-template-columns: 1fr; }
      header h1 { font-size: 1.4rem; }
      .nav-tabs { width: 100%; }
      .tab-btn { flex: 1; padding: 10px 5px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>ADVENTISTAS SV</h1>
    <p>Frases e inspiración diaria • @adventistassv</p>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('gallery')">✨ Frases del Día</button>
      <button class="tab-btn" onclick="switchTab('editor')">✏️ Creador Personalizado</button>
    </div>
  </header>

  <div class="container">
    <!-- GALERÍA DIARIA -->
    <div id="gallerySection">
      <h2 class="section-title">✨ 10 Frases de Hoy</h2>
      <div id="dailyGrid" class="grid-daily"></div>
    </div>

    <!-- CREADOR PERSONALIZADO -->
    <div id="editorSection" class="hidden">
      <h2 class="section-title">✏️ Diseña tu propia imagen</h2>
      <div class="editor-layout">
        
        <div class="editor-controls">
          <div class="form-group">
            <label>Texto de la Frase:</label>
            <textarea id="inputPhrase" class="form-control" oninput="updateCustomCanvas()">DE LA MANO DE DIOS PUEDES CON TODO ¡NO TE RINDAS!</textarea>
          </div>

          <div class="form-group">
            <label>Cita / Referencia:</label>
            <input type="text" id="inputCitation" class="form-control" value="Filipenses 4:13" oninput="updateCustomCanvas()">
          </div>

          <div class="form-group">
            <label>Estilo de Tipografía:</label>
            <select id="selectFont" class="form-control" onchange="updateCustomCanvas()">
              <option value="Montserrat">Montserrat (Moderna y Enfática)</option>
              <option value="Playfair Display">Playfair Display (Elegante Editorial)</option>
              <option value="Oswald">Oswald (Impactante / Alta)</option>
              <option value="Cinzel">Cinzel (Clásica Monumental)</option>
              <option value="Caveat">Caveat (Manuscrita / Cálida)</option>
              <option value="Poppins">Poppins (Limpia y Minimalista)</option>
              <option value="Lora">Lora (Serif Tradicional)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Color de Logo Superior:</label>
            <select id="selectLogo" class="form-control" onchange="updateCustomCanvas()">
              <option value="blanco">Texto Blanco (Para fondos oscuros)</option>
              <option value="negro">Texto Negro (Para fondos muy claros)</option>
              <option value="turquesa">Texto Turquesa (Estilo Marca)</option>
            </select>
          </div>

          <!-- Selector de Fondos con Miniaturas -->
          <div class="form-group">
            <label>Selecciona un Fondo (Haz clic en una miniatura):</label>
            <div id="bgThumbnailGrid" class="bg-grid"></div>
          </div>
        </div>

        <div class="editor-preview">
          <div class="canvas-container" style="max-width: 400px; border-radius: 10px; overflow: hidden;" onclick="openCanvasModal(document.getElementById('customCanvas'))">
            <canvas id="customCanvas"></canvas>
          </div>
          <div style="display: flex; gap: 8px; width: 100%; max-width: 400px;">
            <button class="btn btn-secondary" onclick="openCanvasModal(document.getElementById('customCanvas'))">🔍 Ver</button>
            <button class="btn btn-secondary" onclick="shareCanvasCard(document.getElementById('customCanvas'), document.getElementById('inputPhrase').value, document.getElementById('inputCitation').value)">📲 Compartir</button>
            <button class="btn" onclick="downloadCustomImage()">⬇️ Descargar</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- VISOR PANTALLA COMPLETA -->
  <div id="imageModal" class="modal" onclick="closeModal()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <img id="modalImg" class="modal-content" src="" alt="Vista Previa" onclick="event.stopPropagation()">
  </div>

  <script>
    const LOGOS = {
      blanco: 'logo-blanco.png',
      negro: 'logo-negro.png',
      turquesa: 'logo-turquesa.png'
    };

    const FONT_MAP = {
      'Montserrat': { main: '700 48px "Montserrat", sans-serif', cita: 'italic 34px "Lora", serif', lineH: 66 },
      'Playfair Display': { main: '700 52px "Playfair Display", serif', cita: 'italic 34px "Georgia", serif', lineH: 70 },
      'Oswald': { main: '600 54px "Oswald", sans-serif', cita: 'italic 32px "Poppins", sans-serif', lineH: 70 },
      'Cinzel': { main: '700 46px "Cinzel", serif', cita: 'italic 34px "Lora", serif', lineH: 64 },
      'Caveat': { main: '700 68px "Caveat", cursive', cita: 'italic 32px "Montserrat", sans-serif', lineH: 74 },
      'Poppins': { main: '700 48px "Poppins", sans-serif', cita: 'italic 34px "Playfair Display", serif', lineH: 66 },
      'Lora': { main: '600 50px "Lora", serif', cita: 'italic 32px "Poppins", sans-serif', lineH: 68 }
    };

    const QUOTES_BANK = [
      { frase: "DE LA MANO DE DIOS PUEDES CON TODO ¡NO TE RINDAS!", cita: "Filipenses 4:13" },
      { frase: "NO HAY NADA QUE PUEDAS HACER PARA QUE DIOS DEJE DE AMARTE.", cita: "El Camino a Cristo, p. 15" },
      { frase: "TU VIDA HABLA MÁS FUERTE QUE TUS PALABRAS. VIVE LO QUE PREDICAS.", cita: "1 Corintios 11:1" },
      { frase: "EL AMOR DE DIOS NO TIENE LÍMITES NI CONDICIONES.", cita: "Jeremías 31:3" },
      { frase: "LA ORACIÓN ES LA LLAVE EN LA MANO DE LA FE PARA ABRIR EL ALMACÉN DEL CIELO.", cita: "El Camino a Cristo, p. 94" },
      { frase: "JEHOVÁ ES MI PASTOR; NADA ME FALTARÁ.", cita: "Salmos 23:1" },
      { frase: "CADA AMANECER ES UNA NUEVA OPORTUNIDAD PARA CONFIAR EN DIOS.", cita: "Lamentaciones 3:22-23" },
      { frase: "DIOS NUNCA LLEGA TARDE; SU TIEMPO ES PERFECTO.", cita: "Eclesiastés 3:1" },
      { frase: "LA PAZ DE DIOS SOBREPASARÁ TODO TU ENTENDIMIENTO.", cita: "Filipenses 4:7" },
      { frase: "NUESTRA ÚNICA SEGURIDAD ESTÁ EN LA DIRECCIÓN DE DIOS.", cita: "El Deseado de Todas las Gentes, p. 62" }
    ];

    // Colección ampliada de 12 fotografías
    const STOCK_PHOTOS = [
      'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80',
      'https://images.unsplash.com/photo-1470240731273-7821a6eeb6bd?auto=format&fit=crop&w=600&q=80',
      'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=600&q=80',
      'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80',
      'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=600&q=80',
      'https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?auto=format&fit=crop&w=600&q=80',
      'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=600&q=80',
      'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=600&q=80',
      'https://images.unsplash.com/photo-1507499739999-097706ad8914?auto=format&fit=crop&w=600&q=80',
      'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=600&q=80',
      'https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?auto=format&fit=crop&w=600&q=80',
      'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=80'
    ];

    const GRADIENTS = [
      ['#0f172a', '#1e3a8a'],
      ['#2d124d', '#1e1b4b'],
      ['#134e4a', '#064e3b'],
      ['#7c2d12', '#451a03'],
      ['#312e81', '#4c1d95']
    ];

    let selectedBg = 'photo_0';

    // Carga de imágenes corregida para evitar bloqueo CORS en archivos locales
    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        if (src.startsWith('http://') || src.startsWith('https://')) {
          img.crossOrigin = 'Anonymous';
        }
        img.onload = () => resolve(img);
        img.onerror = (e) => reject(e);
        img.src = src;
      });
    }

    function switchTab(tab) {
      const gSec = document.getElementById('gallerySection');
      const eSec = document.getElementById('editorSection');
      const btns = document.querySelectorAll('.tab-btn');

      if (tab === 'gallery') {
        gSec.classList.remove('hidden');
        eSec.classList.add('hidden');
        btns[0].classList.add('active');
        btns[1].classList.remove('active');
      } else {
        gSec.classList.add('hidden');
        eSec.classList.remove('hidden');
        btns[0].classList.remove('active');
        btns[1].classList.add('active');
        renderBgThumbnails();
        updateCustomCanvas();
      }
    }

    // Generar la galería de miniaturas visuales
    function renderBgThumbnails() {
      const container = document.getElementById('bgThumbnailGrid');
      if (container.children.length > 0) return; // Evitar duplicar

      // Miniaturas de fotos
      STOCK_PHOTOS.forEach((url, i) => {
        const img = document.createElement('img');
        img.src = url;
        img.className = `bg-thumb ${selectedBg === 'photo_' + i ? 'active' : ''}`;
        img.onclick = () => {
          document.querySelectorAll('.bg-thumb').forEach(t => t.classList.remove('active'));
          img.classList.add('active');
          selectedBg = 'photo_' + i;
          updateCustomCanvas();
        };
        container.appendChild(img);
      });

      // Miniaturas de degradados
      GRADIENTS.forEach((grad, i) => {
        const div = document.createElement('div');
        div.className = `bg-thumb ${selectedBg === 'grad_' + i ? 'active' : ''}`;
        div.style.background = `linear-gradient(135deg, ${grad[0]}, ${grad[1]})`;
        div.onclick = () => {
          document.querySelectorAll('.bg-thumb').forEach(t => t.classList.remove('active'));
          div.classList.add('active');
          selectedBg = 'grad_' + i;
          updateCustomCanvas();
        };
        container.appendChild(div);
      });
    }

    async function drawCanvasCard(canvas, phrase, citation, fontName, logoKey, bgType) {
      const ctx = canvas.getContext('2d');
      canvas.width = 1080;
      canvas.height = 1350;

      const fontCfg = FONT_MAP[fontName] || FONT_MAP['Montserrat'];

      // A. FONDO
      if (bgType.startsWith('photo_')) {
        const pIndex = parseInt(bgType.split('_')[1]);
        try {
          const bgImg = await loadImage(STOCK_PHOTOS[pIndex % STOCK_PHOTOS.length]);
          ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.48)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } catch(e) {
          drawGrad(ctx, canvas, 0);
        }
      } else {
        const gIndex = parseInt(bgType.split('_')[1]);
        drawGrad(ctx, canvas, gIndex);
      }

      // B. LOGO
      try {
        const logoImg = await loadImage(LOGOS[logoKey]);
        const logoSize = 160;
        const logoX = (canvas.width - logoSize) / 2;
        ctx.drawImage(logoImg, logoX, 70, logoSize, logoSize);
      } catch (err) {
        console.warn("Recuerda subir " + LOGOS[logoKey] + " a la raíz de tu repositorio en GitHub.");
      }

      // C. TEXTO
      const textColor = (logoKey === 'negro') ? '#1e293b' : '#ffffff';
      const subColor = (logoKey === 'negro') ? '#475569' : '#f1f5f9';

      ctx.textAlign = 'center';
      ctx.fillStyle = textColor;
      ctx.font = fontCfg.main;

      const words = phrase.toUpperCase().split(' ');
      let line = '';
      let y = 600;
      const maxWidth = 880;

      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, canvas.width / 2, y);
          line = words[n] + ' ';
          y += fontCfg.lineH;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, canvas.width / 2, y);

      // Cita
      ctx.font = fontCfg.cita;
      ctx.fillStyle = subColor;
      ctx.fillText(citation, canvas.width / 2, y + 90);

      // D. MARCA DE AGUA
      ctx.font = '600 32px "Montserrat", sans-serif';
      ctx.fillStyle = (logoKey === 'negro') ? 'rgba(0,0,0,0.6)' : 'rgba(255, 255, 255, 0.85)';
      ctx.fillText('@adventistassv', canvas.width / 2, canvas.height - 80);
    }

    function drawGrad(ctx, canvas, index) {
      const colors = GRADIENTS[index % GRADIENTS.length];
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, colors[0]);
      grad.addColorStop(1, colors[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function openCanvasModal(canvas) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = canvas.toDataURL('image/png');
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.remove('active');
    }

    async function shareCanvasCard(canvas, phrase, citation) {
      const shareText = `"${phrase}" - ${citation}\n\nVía @adventistassv`;

      canvas.toBlob(async (blob) => {
        const file = new File([blob], 'adventistassv.png', { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              title: 'Adventistas SV',
              text: shareText,
              files: [file]
            });
          } catch (err) {}
        } else if (navigator.share) {
          try {
            await navigator.share({
              title: 'Adventistas SV',
              text: shareText,
              url: window.location.href
            });
          } catch (err) {}
        } else {
          navigator.clipboard.writeText(shareText);
          alert(`¡Texto copiado al portapapeles!\n\n"${shareText}"\n\nPuedes pegarlo junto a tu imagen descargada.`);
        }
      }, 'image/png');
    }

    function updateCustomCanvas() {
      const phrase = document.getElementById('inputPhrase').value || '';
      const citation = document.getElementById('inputCitation').value || '';
      const font = document.getElementById('selectFont').value;
      const logo = document.getElementById('selectLogo').value;

      const canvas = document.getElementById('customCanvas');
      drawCanvasCard(canvas, phrase, citation, font, logo, selectedBg);
    }

    function downloadCustomImage() {
      const canvas = document.getElementById('customCanvas');
      const link = document.createElement('a');
      link.download = 'adventistassv-creacion.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    async function initDailyGallery() {
      await document.fonts.ready;

      const grid = document.getElementById('dailyGrid');
      grid.innerHTML = '';

      const fontKeys = Object.keys(FONT_MAP);

      for (let i = 0; i < QUOTES_BANK.length; i++) {
        const item = QUOTES_BANK[i];
        const fontName = fontKeys[i % fontKeys.length];

        const card = document.createElement('div');
        card.className = 'card';

        const canvasBox = document.createElement('div');
        canvasBox.className = 'canvas-container';
        canvasBox.onclick = () => openCanvasModal(canvas);

        const canvas = document.createElement('canvas');
        canvasBox.appendChild(canvas);

        const actions = document.createElement('div');
        actions.className = 'card-actions';

        const btnView = document.createElement('button');
        btnView.className = 'btn btn-secondary';
        btnView.innerHTML = '🔍 Ver';
        btnView.onclick = (e) => { e.stopPropagation(); openCanvasModal(canvas); };

        const btnShare = document.createElement('button');
        btnShare.className = 'btn btn-secondary';
        btnShare.innerHTML = '📲 Compartir';
        btnShare.onclick = (e) => { e.stopPropagation(); shareCanvasCard(canvas, item.frase, item.cita); };

        const btnDownload = document.createElement('button');
        btnDownload.className = 'btn';
        btnDownload.innerHTML = '⬇️ Descargar';
        btnDownload.onclick = (e) => {
          e.stopPropagation();
          const link = document.createElement('a');
          link.download = `adventistassv-${i + 1}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        };

        actions.appendChild(btnView);
        actions.appendChild(btnShare);
        actions.appendChild(btnDownload);

        card.appendChild(canvasBox);
        card.appendChild(actions);
        grid.appendChild(card);

        const bgType = (i % 2 === 0) ? `photo_${i % STOCK_PHOTOS.length}` : `grad_${i % GRADIENTS.length}`;
        drawCanvasCard(canvas, item.frase, item.cita, fontName, 'blanco', bgType);
      }
    }

    window.onload = initDailyGallery;
  </script>
</body>
</html>
