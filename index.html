<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventistas SV - Frases Diarias</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #00838f;
      --accent-hover: #006064;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 40px;
    }

    header {
      text-align: center;
      padding: 30px 20px;
      background: #090d16;
      border-bottom: 1px solid #334155;
    }
    header h1 { font-size: 1.8rem; color: #fff; margin-bottom: 5px; }
    header p { color: var(--text-muted); font-size: 0.95rem; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .section-title {
      font-size: 1.4rem;
      margin: 20px 0 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Galería 10 imágenes */
    .grid-daily {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    .canvas-container {
      width: 100%;
      aspect-ratio: 4 / 5;
      position: relative;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .card-actions {
      padding: 12px;
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-outline {
      background: transparent;
      border: 1px solid #475569;
      color: var(--text);
    }
    .btn-outline:hover { background: #334155; }

    /* Responsivo Móvil */
    @media (max-width: 640px) {
      .grid-daily { grid-template-columns: 1fr; }
      header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>ADVENTISTAS SV</h1>
    <p>Frases de fe, esperanza e inspiración diaria • @adventistassv</p>
  </header>

  <div class="container">
    <h2 class="section-title">✨ 10 Frases del Día</h2>
    <div id="dailyGrid" class="grid-daily"></div>
  </div>

  <script>
    // 1. Banco de Logos Oficiales en la raíz del repositorio
    const LOGOS = {
      blanco: './logo-blanco.png',
      negro: './logo-negro.png',
      turquesa: './logo-turquesa.png'
    };

    // 2. Banco de Citas (RVR1960 y Elena G. White)
    const QUOTES_BANK = [
      { frase: "DE LA MANO DE DIOS PUEDES CON TODO ¡NO TE RINDAS!", cita: "Filipenses 4:13", fuente: "RVR1960" },
      { frase: "NO HAY NADA QUE PUEDAS HACER PARA QUE DIOS DEJE DE AMARTE.", cita: "El Camino a Cristo, p. 15", fuente: "E.G. White" },
      { frase: "TU VIDA HABLA MÁS FUERTE QUE TUS PALABRAS. VIVE LO QUE PREDICAS.", cita: "1 Corintios 11:1", fuente: "RVR1960" },
      { frase: "EL AMOR DE DIOS NO TIENE LÍMITES NI CONDICIONES.", cita: "Jeremías 31:3", fuente: "RVR1960" },
      { frase: "LA ORACIÓN ES EL LLAVE EN LA MANO DE LA FE PARA ABRIR EL ALMACÉN DEL CIELO.", cita: "El Camino a Cristo, p. 94", fuente: "E.G. White" },
      { frase: "JEHOVÁ ES MI PASTOR; NADA ME FALTARÁ.", cita: "Salmos 23:1", fuente: "RVR1960" },
      { frase: "CADA AMANECER ES UNA NUEVA OPORTUNIDAD PARA CONFIAR EN DIOS.", cita: "Lamentaciones 3:22-23", fuente: "RVR1960" },
      { frase: "DIOS NUNCA LLEGA TARDE; SU TIEMPO ES PERFECTO.", cita: "Eclesiastés 3:1", fuente: "RVR1960" },
      { frase: "LA PAZ DE DIOS SOBREPASARÁ TODO TU ENTENDIMIENTO.", cita: "Filipenses 4:7", fuente: "RVR1960" },
      { frase: "NUESTRA ÚNICA SEGURIDAD ESTÁ EN LA DIRECCIÓN DE DIOS.", cita: "El Deseado de Todas las Gentes, p. 62", fuente: "E.G. White" },
      { frase: "BUSCAD PRIMERO EL REINO DE DIOS Y SU JUSTICIA.", cita: "Mateo 6:33", fuente: "RVR1960" },
      { frase: "LA FE NO HACE QUE LAS COSAS SEAN FÁCILES, LAS HACE POSIBLES.", cita: "Marcos 9:23", fuente: "RVR1960" }
    ];

    // 3. Fotografías de stock en alta resolución (Orientación vertical)
    const STOCK_PHOTOS = [
      'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1080&q=80',
      'https://images.unsplash.com/photo-1470240731273-7821a6eeb6bd?auto=format&fit=crop&w=1080&q=80',
      'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1080&q=80',
      'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1080&q=80',
      'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1080&q=80'
    ];

    // Cargar imágen con promesas para el Canvas
    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`No se pudo cargar: ${src}`));
        img.src = src;
      });
    }

    // Renderizado en Canvas 1080x1350
    async function renderQuoteCard(canvas, data, bgType, index) {
      const ctx = canvas.getContext('2d');
      canvas.width = 1080;
      canvas.height = 1350;

      // A. DIBUJAR FONDO
      let logoKey = 'blanco'; // Logo blanco por defecto para fondos oscuros

      if (bgType === 'photo') {
        const photoUrl = STOCK_PHOTOS[index % STOCK_PHOTOS.length];
        try {
          const bgImg = await loadImage(photoUrl);
          ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
          
          // Sombra oscura de superposición (Overlay) para asegurar la lectura
          ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } catch(e) {
          drawGradientBackground(ctx, canvas, index);
        }
      } else {
        drawGradientBackground(ctx, canvas, index);
      }

      // B. DIBUJAR LOGO (Header)
      try {
        const logoImg = await loadImage(LOGOS[logoKey]);
        const logoSize = 140;
        const logoX = (canvas.width - logoSize) / 2;
        const logoY = 80; // Margen superior
        ctx.drawImage(logoImg, logoX, logoY, logoSize, logoSize);
      } catch (err) {
        // Fallback si la imagen aún no está disponible
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ADVENTISTAS SV', canvas.width / 2, 120);
      }

      // C. DIBUJAR FRASE Y CITA (Zona Central)
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 50px sans-serif';

      const words = data.frase.split(' ');
      let line = '';
      let y = 620;
      const maxWidth = 860;
      const lineHeight = 68;

      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, canvas.width / 2, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, canvas.width / 2, y);

      // Cita bíblica / libro
      ctx.font = 'italic 36px Georgia, serif';
      ctx.fillStyle = '#f1f5f9';
      ctx.fillText(data.cita, canvas.width / 2, y + 85);

      // D. DIBUJAR MARCA DE AGUA (Footer)
      ctx.font = '600 30px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.fillText('@adventistassv', canvas.width / 2, canvas.height - 90);
    }

    function drawGradientBackground(ctx, canvas, index) {
      const gradients = [
        ['#0f172a', '#1e3a8a'],
        ['#2d124d', '#1e1b4b'],
        ['#134e4a', '#064e3b'],
        ['#7c2d12', '#451a03'],
        ['#312e81', '#4c1d95']
      ];
      const colors = gradients[index % gradients.length];
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, colors[0]);
      grad.addColorStop(1, colors[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Inicializar las 10 imágenes del día
    async function initDailyGallery() {
      const grid = document.getElementById('dailyGrid');
      grid.innerHTML = '';

      // Selecciona 10 frases aleatorias fijadas
      const todayQuotes = QUOTES_BANK.slice(0, 10);

      for (let i = 0; i < todayQuotes.length; i++) {
        const item = todayQuotes[i];
        const card = document.createElement('div');
        card.className = 'card';

        const canvasBox = document.createElement('div');
        canvasBox.className = 'canvas-container';

        const canvas = document.createElement('canvas');
        canvasBox.appendChild(canvas);

        const actions = document.createElement('div');
        actions.className = 'card-actions';

        const btnDownload = document.createElement('button');
        btnDownload.className = 'btn';
        btnDownload.innerHTML = '⬇️ Descargar';
        btnDownload.onclick = () => {
          const link = document.createElement('a');
          link.download = `adventistassv-${i + 1}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        };

        actions.appendChild(btnDownload);
        card.appendChild(canvasBox);
        card.appendChild(actions);
        grid.appendChild(card);

        // Alternar 5 fotos de stock y 5 degradados
        const bgType = (i % 2 === 0) ? 'photo' : 'gradient';
        renderQuoteCard(canvas, item, bgType, i);
      }
    }

    window.onload = initDailyGallery;
  </script>
</body>
</html>
