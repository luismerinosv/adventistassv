<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Adventistas SV - Frases e Imágenes</title>
  
  <!-- Tipografías Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel:wght@700&family=Lora:ital,wght@0,600;1,500&family=Montserrat:ital,wght@0,700;1,500;1,600&family=Oswald:wght@600&family=Playfair+Display:ital,wght@0,700;1,600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #00838f;
      --accent-hover: #006064;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      overflow-x: hidden;
      width: 100%;
    }
    body {
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 40px;
    }

    header {
      text-align: center;
      padding: 20px 15px 12px;
      background: #090d16;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.6rem; color: #fff; margin-bottom: 4px; }
    header p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px; }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      text-align: center;
    }
    .tab-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-title {
      font-size: 1.2rem;
      color: #fff;
    }

    .grid-daily {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .canvas-container {
      width: 100%;
      aspect-ratio: 4 / 5;
      position: relative;
      background: #000;
      cursor: pointer;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .card-actions {
      padding: 10px;
      display: flex;
      gap: 6px;
      background: #172033;
      border-top: 1px solid var(--border);
    }

    .btn {
      flex: 1;
      padding: 10px 6px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.2s;
      min-height: 40px;
      text-decoration: none;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.08); }

    .editor-layout {
      display: flex;
      flex-direction: row;
      gap: 24px;
      align-items: start;
      width: 100%;
    }

    .editor-controls {
      flex: 1;
      width: 100%;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .editor-preview {
      flex: 1;
      width: 100%;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      min-height: 42px;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 75px;
    }

    .bg-grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .bg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding: 6px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .bg-thumb {
      aspect-ratio: 4 / 5;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      object-fit: cover;
      width: 100%;
      height: 100%;
      transition: transform 0.15s, border-color 0.15s;
    }

    .bg-thumb:hover { transform: scale(1.05); }
    .bg-thumb.active {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* Modal Base */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
      backdrop-filter: blur(4px);
    }
    .modal.active { display: flex; }
    .modal-content {
      max-width: 95vw;
      max-height: 85vh;
      border-radius: 12px;
      object-fit: contain;
    }
    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      background: rgba(255,255,255,0.2);
      color: white; border: none; font-size: 22px;
      border-radius: 50%; width: 40px; height: 40px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* Menú de Compartir */
    .share-menu-card {
      background: #ffffff;
      color: #111827;
      border-radius: 14px;
      padding: 8px 0;
      width: 290px;
      max-width: 90vw;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .share-menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      color: #1f2937;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
    }
    .share-menu-item:hover, .share-menu-item:active {
      background: #f3f4f6;
    }
    .share-menu-item svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .share-divider {
      height: 1px;
      background: #e5e7eb;
      margin: 4px 0;
    }

    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .editor-layout {
        flex-direction: column-reverse;
      }
      .editor-preview, .editor-controls {
        width: 100%;
        padding: 16px;
      }
      .grid-daily {
        grid-template-columns: 1fr;
      }
      header h1 { font-size: 1.3rem; }
      .container { padding: 12px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>ADVENTISTAS SV</h1>
    <p>Frases e inspiración diaria • @adventistassv</p>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('gallery')">✨ Frases del Día</button>
      <button class="tab-btn" onclick="switchTab('editor')">✏️ Creador Personalizado</button>
    </div>
  </header>

  <div class="container">
    <!-- GALERÍA DIARIA -->
    <div id="gallerySection">
      <div class="section-header">
        <h2 class="section-title">✨ 10 Frases de Hoy</h2>
        <button class="btn btn-secondary" style="max-width: 220px;" onclick="generateNewQuotesSet()">🔄 Generar 10 Frases Nuevas</button>
      </div>
      <div id="dailyGrid" class="grid-daily"></div>
    </div>

    <!-- CREADOR PERSONALIZADO -->
    <div id="editorSection" class="hidden">
      <h2 class="section-title">✏️ Diseña tu propia imagen</h2>
      <div class="editor-layout">
        
        <div class="editor-preview">
          <div id="previewBox" class="canvas-container" style="max-width: 380px; border-radius: 10px; overflow: hidden;" onclick="openCanvasModal(document.getElementById('customCanvas'))">
            <canvas id="customCanvas"></canvas>
          </div>
          <div style="display: flex; gap: 8px; width: 100%; max-width: 380px;">
            <button class="btn btn-secondary" onclick="openCanvasModal(document.getElementById('customCanvas'))">🔍 Ver</button>
            <button class="btn btn-secondary" onclick="shareCanvasCard(document.getElementById('customCanvas'), document.getElementById('inputPhrase').value, document.getElementById('inputCitation').value, document.getElementById('inputHandle').value)">📲 Compartir</button>
            <button class="btn" onclick="downloadCustomImage()">⬇️ Descargar</button>
          </div>
        </div>

        <div class="editor-controls">
          <div class="form-group">
            <label>Texto de la Frase:</label>
            <textarea id="inputPhrase" class="form-control" oninput="updateCustomCanvas()">DE LA MANO DE DIOS PUEDES CON TODO ¡NO TE RINDAS!</textarea>
          </div>

          <div class="form-group">
            <label>Cita / Referencia:</label>
            <input type="text" id="inputCitation" class="form-control" value="Filipenses 4:13" oninput="updateCustomCanvas()">
          </div>

          <div class="form-group">
            <label>Usuario / Pie de Imagen:</label>
            <input type="text" id="inputHandle" class="form-control" value="@adventistassv" oninput="updateCustomCanvas()">
          </div>

          <div class="form-group">
            <label>Formato / Tamaño de Publicación:</label>
            <select id="selectRatio" class="form-control" onchange="updateCustomCanvas()">
              <option value="4:5">4:5 (Post Feed Instagram/Facebook - 1080x1350)</option>
              <option value="9:16">9:16 (Historias / Reels / TikTok - 1080x1920)</option>
              <option value="1:1">1:1 (Cuadrado Tradicional - 1080x1080)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Estilo de Tipografía:</label>
            <select id="selectFont" class="form-control" onchange="updateCustomCanvas()">
              <option value="Montserrat">Montserrat (Moderna y Enfática)</option>
              <option value="Playfair Display">Playfair Display (Elegante Editorial)</option>
              <option value="Oswald">Oswald (Impactante / Alta)</option>
              <option value="Cinzel">Cinzel (Clásica Monumental)</option>
              <option value="Caveat">Caveat (Manuscrita / Cálida)</option>
              <option value="Poppins">Poppins (Limpia y Minimalista)</option>
              <option value="Lora">Lora (Serif Tradicional)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Color de Logo Superior Oficial:</label>
            <select id="selectLogo" class="form-control" onchange="updateCustomCanvas()">
              <option value="blanco">Texto Blanco (Para fondos oscuros)</option>
              <option value="negro">Texto Negro (Para fondos muy claros)</option>
              <option value="turquesa">Texto Turquesa (Estilo Marca)</option>
            </select>
          </div>

          <div class="form-group">
            <label>📁 Subir mi propia imagen de fondo:</label>
            <input type="file" id="inputCustomBg" class="form-control" accept="image/*" onchange="handleUserBgUpload(event)">
          </div>

          <div class="form-group">
            <div class="bg-grid-header">
              <label>O selecciona una foto del banco:</label>
              <button class="btn btn-secondary" style="padding: 3px 8px; font-size: 0.75rem; min-height: 28px;" onclick="refreshStockPhotos()">🔄 Nuevas fotos</button>
            </div>
            <div id="bgThumbnailGrid" class="bg-grid"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="imageModal" class="modal" onclick="closeModal()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <img id="modalImg" class="modal-content" src="" alt="Vista Previa" onclick="event.stopPropagation()">
  </div>

  <!-- MENÚ FLOTANTE DE OPCIONES DE COMPARTIR -->
  <div id="shareModal" class="modal" onclick="closeShareModal()">
    <div class="share-menu-card" onclick="event.stopPropagation()">
      
      <!-- 1. Facebook -->
      <a id="shareFb" class="share-menu-item" target="_blank">
        <svg fill="#1877F2" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Facebook
      </a>

      <!-- 2. Instagram -->
      <button class="share-menu-item" onclick="triggerNativeShare()">
        <svg fill="#E4405F" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>

      <!-- 3. X (Twitter) -->
      <a id="shareTw" class="share-menu-item" target="_blank">

        X
      </a>

      <!-- 4. Pinterest -->
      <a id="sharePin" class="share-menu-item" target="_blank">
        <svg fill="#E60023" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.372 0 12c0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738.098.119.112.224.083.345l-.333 1.36c-.053.22-.174.267-.402.161-1.499-.698-2.436-2.889-2.436-4.649 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.631-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146C9.57 23.812 10.763 24 12 24c6.627 0 12-5.373 12-12 0-6.628-5.373-12-12-12z"/></svg>

      <!-- 5. Correo electrónico -->
      <a id="shareMail" class="share-menu-item">
        <svg fill="#4b5563" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        Correo electrónico
      </a>

      <div class="share-divider"></div>

      <!-- Compartir a través de... (Selector Nativo del Teléfono) -->

        <svg fill="#4b5563" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>

      <div class="share-divider"></div>

      <!-- Copiar enlace / Texto -->
      <button class="share-menu-item" onclick="copyShareText()">
        <svg fill="#4b5563" viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>

  <script>
    const LOGOS = {
      blanco: 'logo-blanco.png',
      negro: 'logo-negro.png',
      turquesa: 'logo-turquesa.png'
    };

    const loadedLogos = {};

    const FONT_MAP = {
      'Montserrat': { main: '700 48px "Montserrat", sans-serif', cita: 'italic 34px "Lora", serif', lineH: 66 },
      'Playfair Display': { main: '700 52px "Playfair Display", serif', cita: 'italic 34px "Georgia", serif', lineH: 70 },
      'Oswald': { main: '600 54px "Oswald", sans-serif', cita: 'italic 32px "Poppins", sans-serif', lineH: 70 },
      'Cinzel': { main: '700 46px "Cinzel", serif', cita: 'italic 34px "Lora", serif', lineH: 64 },
      'Caveat': { main: '700 68px "Caveat", cursive', cita: 'italic 32px "Montserrat", sans-serif', lineH: 74 },
      'Poppins': { main: '700 48px "Poppins", sans-serif', cita: 'italic 34px "Playfair Display", serif', lineH: 66 },
      'Lora': { main: '600 50px "Lora", serif', cita: 'italic 32px "Poppins", sans-serif', lineH: 68 }
    };

    const QUOTES_BANK = [
      { frase: "DE LA MANO DE DIOS PUEDES CON TODO ¡NO TE RINDAS!", cita: "Filipenses 4:13" },
      { frase: "NO HAY NADA QUE PUEDAS HACER PARA QUE DIOS DEJE DE AMARTE.", cita: "El Camino a Cristo, p. 15" },
      { frase: "TU VIDA HABLA MÁS FUERTE QUE TUS PALABRAS. VIVE LO QUE PREDICAS.", cita: "1 Corintios 11:1" },
      { frase: "EL AMOR DE DIOS NO TIENE LÍMITES NI CONDICIONES.", cita: "Jeremías 31:3" },
      { frase: "LA ORACIÓN ES LA LLAVE EN LA MANO DE LA FE PARA ABRIR EL ALMACÉN DEL CIELO.", cita: "El Camino a Cristo, p. 94" },
      { frase: "JEHOVÁ ES MI PASTOR; NADA ME FALTARÁ.", cita: "Salmos 23:1" },

    const ALL_STOCK_PHOTOS = [

      'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=800&q=80',

    let STOCK_PHOTOS = ALL_STOCK_PHOTOS.slice(0, 8);

    const GRADIENTS = [
      ['#0f172a', '#1e3a8a'],
      ['#2d124d', '#1e1b4b'],
      ['#134e4a', '#064e3b'],
      ['#7c2d12', '#451a03'],
      ['#312e81', '#4c1d95']
    ];

    let selectedBg = 'photo_0';
    let userCustomImg = null;
    let currentShareText = '';
    let currentShareCanvas = null;

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        if (src.startsWith('http://') || src.startsWith('https://')) {
          img.crossOrigin = 'Anonymous';
        }
        img.onload = () => resolve(img);
        img.onerror = (e) => reject(e);
        img.src = src;
      });
    }

    function dataURLtoFile(dataurl, filename) {
      const arr = dataurl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
      }
      return new File([u8arr], filename, { type: mime });
    }

    async function preloadLogos() {
      for (const key in LOGOS) {
        try {
          loadedLogos[key] = await loadImage(LOGOS[key]);
        } catch (e) {}
      }
    }

    function handleUserBgUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            userCustomImg = img;
            selectedBg = 'user_custom';
            document.querySelectorAll('.bg-thumb').forEach(t => t.classList.remove('active'));
            updateCustomCanvas();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function refreshStockPhotos() {
      const shuffled = [...ALL_STOCK_PHOTOS].sort(() => 0.5 - Math.random());
      STOCK_PHOTOS = shuffled.slice(0, 8);
      renderBgThumbnails(true);
      updateCustomCanvas();
    }

    function switchTab(tab) {
      const gSec = document.getElementById('gallerySection');
      const eSec = document.getElementById('editorSection');
      const btns = document.querySelectorAll('.tab-btn');

      if (tab === 'gallery') {
        gSec.classList.remove('hidden');
        eSec.classList.add('hidden');
        btns[0].classList.add('active');
        btns[1].classList.remove('active');
      } else {
        gSec.classList.add('hidden');
        eSec.classList.remove('hidden');
        btns[0].classList.remove('active');
        btns[1].classList.add('active');
        renderBgThumbnails();
        updateCustomCanvas();
      }
    }

    function renderBgThumbnails(force = false) {
      const container = document.getElementById('bgThumbnailGrid');
      if (container.children.length > 0 && !force) return;
      container.innerHTML = '';

      STOCK_PHOTOS.forEach((url, i) => {
        const img = document.createElement('img');
        img.src = url;
        img.className = `bg-thumb ${selectedBg === 'photo_' + i ? 'active' : ''}`;
        img.onclick = () => {
          document.querySelectorAll('.bg-thumb').forEach(t => t.classList.remove('active'));
          img.classList.add('active');
          selectedBg = 'photo_' + i;
          updateCustomCanvas();
        };
        container.appendChild(img);
      });

      GRADIENTS.forEach((grad, i) => {
        const div = document.createElement('div');
        div.className = `bg-thumb ${selectedBg === 'grad_' + i ? 'active' : ''}`;
        div.style.background = `linear-gradient(135deg, ${grad[0]}, ${grad[1]})`;
        div.onclick = () => {
          document.querySelectorAll('.bg-thumb').forEach(t => t.classList.remove('active'));
          div.classList.add('active');
          selectedBg = 'grad_' + i;
          updateCustomCanvas();
        };
        container.appendChild(div);
      });
    }

    function drawCoverImage(ctx, img, targetW, targetH) {
      const imgRatio = img.naturalWidth / img.naturalHeight;
      const targetRatio = targetW / targetH;
      let renderW, renderH, offsetX, offsetY;

      if (imgRatio > targetRatio) {
        renderH = targetH;
        renderW = targetH * imgRatio;
        offsetX = (targetW - renderW) / 2;
        offsetY = 0;
      } else {
        renderW = targetW;
        renderH = targetW / imgRatio;
        offsetX = 0;
        offsetY = (targetH - renderH) / 2;
      }
      ctx.drawImage(img, offsetX, offsetY, renderW, renderH);
    }

    async function drawCanvasCard(canvas, phrase, citation, fontName, logoKey, bgType, handleText = '@adventistassv', ratioKey = '4:5') {
      const ctx = canvas.getContext('2d');
      
      canvas.width = 1080;
      let targetHeight = 1350;
      if (ratioKey === '9:16') targetHeight = 1920;
      if (ratioKey === '1:1') targetHeight = 1080;
      canvas.height = targetHeight;

      const previewBox = document.getElementById('previewBox');
      if (previewBox) {
        if (ratioKey === '9:16') previewBox.style.aspectRatio = '9 / 16';
        else if (ratioKey === '1:1') previewBox.style.aspectRatio = '1 / 1';
        else previewBox.style.aspectRatio = '4 / 5';
      }

      const fontCfg = FONT_MAP[fontName] || FONT_MAP['Montserrat'];
      const marginX = 100;
      const maxWidth = canvas.width - (marginX * 2);

      if (bgType === 'user_custom' && userCustomImg) {
        drawCoverImage(ctx, userCustomImg, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.48)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else if (bgType.startsWith('photo_')) {
        const pIndex = parseInt(bgType.split('_')[1]);
        try {
          const bgImg = await loadImage(STOCK_PHOTOS[pIndex % STOCK_PHOTOS.length]);
          drawCoverImage(ctx, bgImg, canvas.width, canvas.height);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.52)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } catch(e) {
          drawGrad(ctx, canvas, 0);
        }
      } else {
        const gIndex = parseInt(bgType.split('_')[1]);
        drawGrad(ctx, canvas, gIndex);
      }

      const topGradHeight = (ratioKey === '9:16') ? 320 : 260;
      const topGrad = ctx.createLinearGradient(0, 0, 0, topGradHeight);
      topGrad.addColorStop(0, 'rgba(0, 0, 0, 0.70)');
      topGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = topGrad;
      ctx.fillRect(0, 0, canvas.width, topGradHeight);

      const botGradHeight = (ratioKey === '9:16') ? 280 : 220;
      const botGrad = ctx.createLinearGradient(0, canvas.height - botGradHeight, 0, canvas.height);
      botGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
      botGrad.addColorStop(1, 'rgba(0, 0, 0, 0.70)');
      ctx.fillStyle = botGrad;
      ctx.fillRect(0, canvas.height - botGradHeight, canvas.width, botGradHeight);

      let logoImg = loadedLogos[logoKey];
      if (!logoImg) {
        try {
          logoImg = await loadImage(LOGOS[logoKey]);
          loadedLogos[logoKey] = logoImg;
        } catch(e) {}
      }

      let logoY = 65;
      if (ratioKey === '9:16') logoY = 125;
      if (ratioKey === '1:1') logoY = 50;

      if (logoImg) {
        const logoWidth = 175;
        const aspectRatio = logoImg.naturalHeight / logoImg.naturalWidth || 1;
        const logoHeight = logoWidth * aspectRatio;
        const logoX = (canvas.width - logoWidth) / 2;
        ctx.drawImage(logoImg, logoX, logoY, logoWidth, logoHeight);
      }

      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = fontCfg.main;

      ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
      ctx.shadowBlur = 14;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 3;

      const words = phrase.toUpperCase().split(' ');
      let lines = [];
      let currentLine = '';

      for (let n = 0; n < words.length; n++) {
        let testLine = currentLine + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          lines.push(currentLine.trim());
          currentLine = words[n] + ' ';
        } else {
          currentLine = testLine;
        }
      }
      lines.push(currentLine.trim());

      const totalTextHeight = (lines.length * fontCfg.lineH) + 90;
      let startY = (canvas.height / 2) - (totalTextHeight / 2) + 20;

      const minStartY = logoY + 160;
      if (startY < minStartY) startY = minStartY;

      let y = startY;
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], canvas.width / 2, y);
        y += fontCfg.lineH;
      }

      ctx.font = fontCfg.cita;
      ctx.fillStyle = '#f1f5f9';
      ctx.fillText(citation, canvas.width / 2, y + 45);
      ctx.restore();

      let footerY = canvas.height - 70;
      if (ratioKey === '9:16') footerY = canvas.height - 110;
      if (ratioKey === '1:1') footerY = canvas.height - 45;

      ctx.save();
      ctx.font = 'italic 500 24px "Montserrat", sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
      ctx.shadowBlur = 8;
      ctx.fillText(handleText || '@adventistassv', canvas.width / 2, footerY);
      ctx.restore();
    }

    function drawGrad(ctx, canvas, index) {
      const colors = GRADIENTS[index % GRADIENTS.length];
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, colors[0]);
      grad.addColorStop(1, colors[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function openCanvasModal(canvas) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = canvas.toDataURL('image/png');
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.remove('active');
    }

    /* SIEMPRE ABRIR PRIMERO EL MENÚ CON FACEBOOK, INSTAGRAM, X, PINTEREST Y DEMÁS */
    function shareCanvasCard(canvas, phrase, citation, handle = '@adventistassv') {
      const shareText = `"${phrase}" - ${citation}\n\nVía ${handle}`;
      currentShareText = shareText;
      currentShareCanvas = canvas;

      const encodedText = encodeURIComponent(shareText);
      const siteUrl = encodeURIComponent(window.location.href);

      document.getElementById('shareFb').href = `https://www.facebook.com/sharer/sharer.php?u=${siteUrl}&quote=${encodedText}`;
      document.getElementById('sharePin').href = `https://pinterest.com/pin/create/button/?url=${siteUrl}&description=${encodedText}`;
      document.getElementById('shareTw').href = `https://twitter.com/intent/tweet?text=${encodedText}`;
      document.getElementById('shareMail').href = `mailto:?subject=Adventistas%20SV&body=${encodedText}`;

      document.getElementById('shareModal').classList.add('active');
    }

    /* DISPARAR EL MOTOR NATIVO DESDE EL BOTÓN O LA OPCIÓN DE INSTAGRAM */
    async function triggerNativeShare() {
      if (!currentShareCanvas) return;

      try {
        const dataUrl = currentShareCanvas.toDataURL('image/png');
        const file = dataURLtoFile(dataUrl, 'adventistassv-frase.png');

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: 'Adventistas SV',
            text: currentShareText,
            files: [file]
          });
          closeShareModal();
          return;
        } else if (navigator.share) {
          await navigator.share({
            title: 'Adventistas SV',
            text: currentShareText
          });
          closeShareModal();
          return;
        }
      } catch (err) {
        console.warn('No se pudo enviar mediante motor nativo:', err);
      }

      copyShareText();
    }

    function closeShareModal() {
      document.getElementById('shareModal').classList.remove('active');
    }

    function copyShareText() {
      navigator.clipboard.writeText(currentShareText);
      alert('¡Texto copiado al portapapeles!\n\nSe descargará la imagen para que puedas publicarla.');
      if (currentShareCanvas) {
        const link = document.createElement('a');
        link.download = 'adventistassv-frase.png';
        link.href = currentShareCanvas.toDataURL('image/png');
        link.click();
      }
      closeShareModal();
    }

    function updateCustomCanvas() {
      const phrase = document.getElementById('inputPhrase').value || '';
      const citation = document.getElementById('inputCitation').value || '';
      const handle = document.getElementById('inputHandle').value || '@adventistassv';
      const font = document.getElementById('selectFont').value;
      const logo = document.getElementById('selectLogo').value;
      const ratio = document.getElementById('selectRatio').value;

      const canvas = document.getElementById('customCanvas');
      drawCanvasCard(canvas, phrase, citation, font, logo, selectedBg, handle, ratio);
    }

    function downloadCustomImage() {
      const canvas = document.getElementById('customCanvas');
      const link = document.createElement('a');
      link.download = 'adventistassv-creacion.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    async function generateNewQuotesSet() {
      const shuffledQuotes = [...QUOTES_BANK].sort(() => 0.5 - Math.random()).slice(0, 10);
      const shuffledPhotos = [...ALL_STOCK_PHOTOS].sort(() => 0.5 - Math.random());
      STOCK_PHOTOS = shuffledPhotos.slice(0, 8);

      renderDailyGrid(shuffledQuotes);
    }

    async function renderDailyGrid(quotesList) {
      const grid = document.getElementById('dailyGrid');
      grid.innerHTML = '';

      const fontKeys = Object.keys(FONT_MAP);
      const logoRotation = ['blanco', 'turquesa', 'blanco', 'blanco', 'turquesa'];

      for (let i = 0; i < quotesList.length; i++) {
        const item = quotesList[i];
        const fontName = fontKeys[i % fontKeys.length];
        const logoKey = logoRotation[i % logoRotation.length];

        const card = document.createElement('div');
        card.className = 'card';

        const canvasBox = document.createElement('div');
        canvasBox.className = 'canvas-container';
        canvasBox.onclick = () => openCanvasModal(canvas);

        const canvas = document.createElement('canvas');
        canvasBox.appendChild(canvas);

        const actions = document.createElement('div');
        actions.className = 'card-actions';

        const btnView = document.createElement('button');
        btnView.className = 'btn btn-secondary';
        btnView.innerHTML = '🔍 Ver';
        btnView.onclick = (e) => { e.stopPropagation(); openCanvasModal(canvas); };

        const btnShare = document.createElement('button');
        btnShare.className = 'btn btn-secondary';
        btnShare.innerHTML = '📲 Compartir';
        btnShare.onclick = (e) => { e.stopPropagation(); shareCanvasCard(canvas, item.frase, item.cita, '@adventistassv'); };

        const btnDownload = document.createElement('button');
        btnDownload.className = 'btn';
        btnDownload.innerHTML = '⬇️ Descargar';
        btnDownload.onclick = (e) => {
          e.stopPropagation();
          const link = document.createElement('a');
          link.download = `adventistassv-${i + 1}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        };

        actions.appendChild(btnView);
        actions.appendChild(btnShare);
        actions.appendChild(btnDownload);

        card.appendChild(canvasBox);
        card.appendChild(actions);
        grid.appendChild(card);

        const bgType = (i % 2 === 0) ? `photo_${i % STOCK_PHOTOS.length}` : `grad_${i % GRADIENTS.length}`;
        drawCanvasCard(canvas, item.frase, item.cita, fontName, logoKey, bgType, '@adventistassv', '4:5');
      }
    }

    async function initDailyGallery() {
      await preloadLogos();
      await document.fonts.ready;
      renderDailyGrid(QUOTES_BANK.slice(0, 10));
    }

    window.onload = initDailyGallery;
  </script>
